<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1150" width="100%" height="100%" style="background:#F8FAFC; font-family:'Pretendard', 'Noto Sans KR', sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <style>
    .title { font-size: 26px; font-weight: 800; fill: #0F172A; text-anchor: middle; }
    .subtitle { font-size: 14px; fill: #475569; text-anchor: middle; }
    .legend-text { font-size: 11px; fill: #475569; }
    .card-title { font-size: 13px; font-weight: 700; fill: #0F172A; text-anchor: middle; }
    .card-sub { font-size: 10px; fill: #64748B; text-anchor: middle; }
    .gnb-title { font-size: 14px; font-weight: 800; fill: #FFFFFF; text-anchor: middle; }
    .gnb-sub { font-size: 11px; fill: #CBD5E1; text-anchor: middle; }
    .section-head { font-size: 14px; font-weight: 800; fill: #1E293B; }
    .journey-label { font-size: 12px; font-weight: 700; fill: #334155; }
    .journey-node { font-size: 11px; fill: #1E293B; text-anchor: middle; }
    .footnote { font-size: 11px; fill: #64748B; text-anchor: middle; }
  </style>

  <!-- Header -->
  <text x="600" y="45" class="title">사단 멤버십 익스프레스 글로벌 퍼퓸 정기 배송 플랫폼 사이트맵 (백지민)</text>
  <text x="600" y="70" class="subtitle">글로벌 비디오 ➔ 구독 플랜 비교 ➔ 사계절 조향 큐레이션 ➔ 50개국 무료 배송 | 최대 3단계 깊이</text>

  <!-- Top Legend Right Bar -->
  <g transform="translate(820, 30)">
    <rect x="0" y="0" width="350" height="40" rx="6" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
    <rect x="15" y="14" width="12" height="12" rx="2" fill="#1E3A8A"/>
    <text x="32" y="24" class="legend-text">1차/GNB</text>
    
    <rect x="95" y="14" width="12" height="12" rx="2" fill="#E2E8F0" stroke="#CBD5E1"/>
    <text x="112" y="24" class="legend-text">공통</text>

    <rect x="150" y="14" width="12" height="12" rx="2" fill="#EEF2FF" stroke="#C7D2FE"/>
    <text x="167" y="24" class="legend-text">회원</text>

    <rect x="205" y="14" width="12" height="12" rx="2" fill="#FEF3C7" stroke="#F59E0B" stroke-dasharray="2,2"/>
    <text x="222" y="24" class="legend-text">가정</text>

    <rect x="260" y="14" width="12" height="12" rx="2" fill="#FEE2E2" stroke="#EF4444" stroke-dasharray="2,2"/>
    <text x="277" y="24" class="legend-text">예외</text>
  </g>

  <!-- Root Node -->
  <rect x="440" y="95" width="320" height="48" rx="8" fill="#1E3A8A" filter="url(#shadow)"/>
  <text x="600" y="118" class="gnb-title">홈 · 공통</text>
  <text x="600" y="133" class="gnb-sub">브랜드 메시지 · 핵심 CTA · 전역 내비게이션</text>

  <!-- Main 5 Columns Lines &amp; Headers -->
  <line x1="600" y1="143" x2="600" y2="165" stroke="#94A3B8" stroke-width="2"/>
  <line x1="120" y1="165" x2="1080" y2="165" stroke="#94A3B8" stroke-width="2"/>

  <!-- Column 1 -->
  <line x1="120" y1="165" x2="120" y2="190" stroke="#94A3B8" stroke-width="2"/>
  <rect x="30" y="190" width="180" height="50" rx="6" fill="#1E3A8A" filter="url(#shadow)"/>
  <text x="120" y="212" class="gnb-title">Express Intro · 1차</text>
  <text x="120" y="228" class="gnb-sub">브랜드 라이프 ➔ 혜택 신뢰</text>

  <!-- Column 2 -->
  <line x1="360" y1="165" x2="360" y2="190" stroke="#94A3B8" stroke-width="2"/>
  <rect x="270" y="190" width="180" height="50" rx="6" fill="#1E3A8A" filter="url(#shadow)"/>
  <text x="360" y="212" class="gnb-title">Subscription Plan · 1차</text>
  <text x="360" y="228" class="gnb-sub">월간 vs 분기 ➔ 혜택 비교 ➔ 가입</text>

  <!-- Column 3 -->
  <line x1="600" y1="165" x2="600" y2="190" stroke="#94A3B8" stroke-width="2"/>
  <rect x="510" y="190" width="180" height="50" rx="6" fill="#1E3A8A" filter="url(#shadow)"/>
  <text x="600" y="212" class="gnb-title">Seasonal Curation · 1차</text>
  <text x="600" y="228" class="gnb-sub">4계절 퍼퓸 ➔ 조향사 노트</text>

  <!-- Column 4 -->
  <line x1="840" y1="165" x2="840" y2="190" stroke="#94A3B8" stroke-width="2"/>
  <rect x="750" y="190" width="180" height="50" rx="6" fill="#1E3A8A" filter="url(#shadow)"/>
  <text x="840" y="212" class="gnb-title">Global Delivery · 1차</text>
  <text x="840" y="228" class="gnb-sub">50개국 지도 ➔ 예상일 ➔ 무료배송</text>

  <!-- Column 5 -->
  <line x1="1080" y1="165" x2="1080" y2="190" stroke="#94A3B8" stroke-width="2"/>
  <rect x="990" y="190" width="180" height="50" rx="6" fill="#1E3A8A" filter="url(#shadow)"/>
  <text x="1080" y="212" class="gnb-title">웰컴 혜택 &amp; 50% 할인 · 1차</text>
  <text x="1080" y="228" class="gnb-sub">웰컴 50% ➔ 친구 추천 ➔ 전환</text>

  <!-- Nodes Generation for Columns -->
  <!-- Col 1 Nodes -->
  <rect x="30" y="260" width="180" height="42" rx="6" fill="#F1F5F9" stroke="#CBD5E1"/>
  <text x="120" y="278" class="card-title">글로벌 퍼퓸 배송 비디오</text>
  <text x="120" y="293" class="card-sub">2차 · 공통</text>

  <rect x="30" y="315" width="180" height="42" rx="6" fill="#F1F5F9" stroke="#CBD5E1"/>
  <text x="120" y="333" class="card-title">첫 달 50% 웰컴 프로모션</text>
  <text x="120" y="348" class="card-sub">2차 · 쿠폰 코드</text>

  <rect x="30" y="370" width="180" height="42" rx="6" fill="#F1F5F9" stroke="#CBD5E1"/>
  <text x="120" y="388" class="card-title">마패 패키지 3D 스토리</text>
  <text x="120" y="403" class="card-sub">2차 · 공통</text>

  <!-- Col 2 Nodes -->
  <rect x="270" y="260" width="180" height="42" rx="6" fill="#F1F5F9" stroke="#CBD5E1"/>
  <text x="360" y="278" class="card-title">월간 Monthly Plan 요금</text>
  <text x="360" y="293" class="card-sub">2차 · $39/월</text>

  <rect x="270" y="315" width="180" height="42" rx="6" fill="#F1F5F9" stroke="#CBD5E1"/>
  <text x="360" y="333" class="card-title">분기별 Quarterly Plan 요금</text>
  <text x="360" y="348" class="card-sub">2차 · $99/분기 · 17%</text>

  <rect x="270" y="370" width="180" height="42" rx="6" fill="#F1F5F9" stroke="#CBD5E1"/>
  <text x="360" y="388" class="card-title">멤버십 1-Click 가입 모달</text>
  <text x="360" y="403" class="card-sub">2차 · 해외/국내</text>

  <!-- Col 3 Nodes -->
  <rect x="510" y="260" width="180" height="42" rx="6" fill="#F1F5F9" stroke="#CBD5E1"/>
  <text x="600" y="278" class="card-title">사계절 큐레이션 소개</text>
  <text x="600" y="293" class="card-sub">2차 · 공통</text>

  <rect x="510" y="315" width="180" height="42" rx="6" fill="#EEF2FF" stroke="#C7D2FE"/>
  <text x="600" y="333" class="card-title">봄·여름·가을·겨울 4대 카트리지</text>
  <text x="600" y="348" class="card-sub">2차 · 퍼퓸 룩북</text>

  <rect x="510" y="370" width="180" height="42" rx="6" fill="#EEF2FF" stroke="#C7D2FE"/>
  <text x="600" y="388" class="card-title">조향사 상세 노트 팝업</text>
  <text x="600" y="403" class="card-sub">2차 · 탑/미들/베이스</text>

  <!-- Col 4 Nodes -->
  <rect x="750" y="260" width="180" height="42" rx="6" fill="#F1F5F9" stroke="#CBD5E1"/>
  <text x="840" y="278" class="card-title">50개국 무료 배송 지도</text>
  <text x="840" y="293" class="card-sub">2차 · 인터랙티브</text>

  <rect x="750" y="315" width="180" height="42" rx="6" fill="#F1F5F9" stroke="#CBD5E1"/>
  <text x="840" y="333" class="card-title">국가별 배송일 계산기</text>
  <text x="840" y="348" class="card-sub">2차 · 3~5일 소요</text>

  <rect x="750" y="370" width="180" height="42" rx="6" fill="#F1F5F9" stroke="#CBD5E1"/>
  <text x="840" y="388" class="card-title">가입 완료 &amp; 배송 팝업</text>
  <text x="840" y="403" class="card-sub">3차 · 송장 추적</text>

  <!-- Col 5 Nodes -->
  <rect x="990" y="260" width="180" height="42" rx="6" fill="#F1F5F9" stroke="#CBD5E1"/>
  <text x="1080" y="278" class="card-title">글로벌 회원 구체적 후기</text>
  <text x="1080" y="293" class="card-sub">2차 · 핀후기</text>

  <rect x="990" y="315" width="180" height="42" rx="6" fill="#F1F5F9" stroke="#CBD5E1"/>
  <text x="1080" y="333" class="card-title">FAQ</text>
  <text x="1080" y="348" class="card-sub">2차 · 플랜/배송/통관</text>

  <rect x="990" y="370" width="180" height="42" rx="6" fill="#F1F5F9" stroke="#CBD5E1"/>
  <text x="1080" y="388" class="card-title">첫 달 50% 할인 쿠폰 받기</text>
  <text x="1080" y="403" class="card-sub">2차 · 전역 Floating CTA</text>

  <!-- Middle Section: Member State Area (Left) &amp; Exception Area (Right) -->
  <g transform="translate(30, 445)">
    <rect x="0" y="0" width="560" height="190" rx="8" fill="#FEF3C7" fill-opacity="0.4" stroke="#F59E0B" stroke-dasharray="4,4" stroke-width="1.5"/>
    <text x="16" y="24" class="section-head">회원 상태별 영역 · 가정</text>
    <text x="16" y="42" class="footnote" style="text-anchor:start;">입력에 인증/마이페이지 명세가 없어 최소 구조로 제안</text>

    <rect x="16" y="60" width="120" height="40" rx="6" fill="#FEF3C7" stroke="#F59E0B"/>
    <text x="76" y="78" class="card-title">로그인</text>
    <text x="76" y="92" class="card-sub">1차 · 비회원 · 가정</text>

    <line x1="136" y1="80" x2="176" y2="80" stroke="#F59E0B" stroke-dasharray="2,2" stroke-width="2"/>

    <rect x="176" y="60" width="130" height="40" rx="6" fill="#FEF3C7" stroke="#F59E0B"/>
    <text x="241" y="78" class="card-title">마이페이지 / Hub</text>
    <text x="241" y="92" class="card-sub">1차 · 회원 · 가정</text>

    <line x1="306" y1="80" x2="346" y2="80" stroke="#F59E0B" stroke-dasharray="2,2" stroke-width="2"/>

    <rect x="346" y="60" width="195" height="40" rx="6" fill="#FEF3C7" stroke="#F59E0B"/>
    <text x="443" y="78" class="card-title">향 셀프 변경 &amp; 일시정지</text>
    <text x="443" y="92" class="card-sub">2차 · 차회 배송 연결</text>

    <rect x="346" y="115" width="195" height="40" rx="6" fill="#FEF3C7" stroke="#F59E0B"/>
    <text x="443" y="133" class="card-title">구독 &amp; 배송 조회 내역</text>
    <text x="443" y="147" class="card-sub">2차 · 배송 추적 연결</text>
  </g>

  <g transform="translate(610, 445)">
