    <text x="16" y="42" class="footnote" style="text-anchor:start;">시스템 오류 및 권한 예외 상황 대응 구조</text>

    <rect x="16" y="60" width="528" height="35" rx="6" fill="#FEE2E2" stroke="#EF4444"/>
    <text x="280" y="76" class="card-title">404 페이지 없음</text>
    <text x="280" y="89" class="card-sub">홈/GNB로 복구</text>

    <rect x="16" y="103" width="528" height="35" rx="6" fill="#FEE2E2" stroke="#EF4444"/>
    <text x="280" y="119" class="card-title">제휴 병원 결과 없음 / 위치 거부</text>
    <text x="280" y="132" class="card-sub">지역 직접 검색/재시도</text>

    <rect x="16" y="146" width="528" height="35" rx="6" fill="#FEE2E2" stroke="#EF4444"/>
    <text x="280" y="162" class="card-title">세션 만료 / 접근 권한 없음</text>
    <text x="280" y="175" class="card-sub">로그인/소개로 복구</text>
  </g>

  <!-- Bottom Section: User Journeys &amp; Cross-connections -->
  <g transform="translate(30, 660)">
    <rect x="0" y="0" width="1140" height="430" rx="10" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
