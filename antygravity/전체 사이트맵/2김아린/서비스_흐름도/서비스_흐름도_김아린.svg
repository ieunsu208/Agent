        <text x="75" y="22" class="journey-node">피부 장벽 통계</text>
        <line x1="150" y1="18" x2="180" y2="18" stroke="#94A3B8" stroke-width="2"/>

        <rect x="180" y="0" width="150" height="36" rx="6" fill="#F1F5F9" stroke="#CBD5E1"/>
        <text x="255" y="22" class="journey-node">PDRN 원천 기술</text>
        <line x1="330" y1="18" x2="360" y2="18" stroke="#94A3B8" stroke-width="2"/>

        <rect x="360" y="0" width="150" height="36" rx="6" fill="#F1F5F9" stroke="#CBD5E1"/>
        <text x="435" y="22" class="journey-node">앰플 상세</text>
        <line x1="510" y1="18" x2="540" y2="18" stroke="#94A3B8" stroke-width="2"/>

        <rect x="540" y="0" width="150" height="36" rx="6" fill="#F1F5F9" stroke="#CBD5E1"/>
        <text x="615" y="22" class="journey-node">맞춤 추천</text>
        <line x1="690" y1="18" x2="720" y2="18" stroke="#94A3B8" stroke-width="2"/>

        <rect x="720" y="0" width="170" height="36" rx="6" fill="#F1F5F9" stroke="#CBD5E1"/>
        <text x="805" y="22" class="journey-node">웰컴 샘플 신청/완료</text>
      </g>
    </g>

    <!-- Journey 2 -->
    <g transform="translate(24, 130)">
      <text x="0" y="20" class="journey-label">2. 피부 진단 ➔ 회원 사용</text>
      <g transform="translate(200, 0)">
        <rect x="0" y="0" width="150" height="36" rx="6" fill="#F1F5F9" stroke="#CBD5E1"/>
        <text x="75" y="22" class="journey-node">AI 진단 소개</text>
        <line x1="150" y1="18" x2="180" y2="18" stroke="#94A3B8" stroke-width="2"/>

        <rect x="180" y="0" width="150" height="36" rx="6" fill="#FEF3C7" stroke="#F59E0B" stroke-dasharray="3,3"/>
        <text x="255" y="22" class="journey-node">로그인·가정</text>
        <line x1="330" y1="18" x2="360" y2="18" stroke="#94A3B8" stroke-width="2"/>

        <rect x="360" y="0" width="170" height="36" rx="6" fill="#EEF2FF" stroke="#C7D2FE"/>
        <text x="445" y="22" class="journey-node">실시간 피부 대시보드</text>
        <line x1="530" y1="18" x2="560" y2="18" stroke="#94A3B8" stroke-width="2"/>

        <rect x="560" y="0" width="170" height="36" rx="6" fill="#EEF2FF" stroke="#C7D2FE"/>
        <text x="645" y="22" class="journey-node">맞춤 케어 가이드</text>
      </g>
    </g>

    <!-- Journey 3 -->
    <g transform="translate(24, 200)">
      <text x="0" y="20" class="journey-label">3. 제휴 피부과 예약</text>
      <g transform="translate(200, 0)">
        <rect x="0" y="0" width="150" height="36" rx="6" fill="#F1F5F9" stroke="#CBD5E1"/>
        <text x="75" y="22" class="journey-node">병원 찾기</text>
        <line x1="150" y1="18" x2="180" y2="18" stroke="#94A3B8" stroke-width="2"/>

        <rect x="180" y="0" width="150" height="36" rx="6" fill="#F1F5F9" stroke="#CBD5E1"/>
        <text x="255" y="22" class="journey-node">병원 상세</text>
        <line x1="330" y1="18" x2="360" y2="18" stroke="#94A3B8" stroke-width="2"/>

        <rect x="360" y="0" width="150" height="36" rx="6" fill="#F1F5F9" stroke="#CBD5E1"/>
        <text x="435" y="22" class="journey-node">4단계 이내 예약</text>
        <line x1="510" y1="18" x2="540" y2="18" stroke="#94A3B8" stroke-width="2"/>

        <rect x="540" y="0" width="150" height="36" rx="6" fill="#F1F5F9" stroke="#CBD5E1"/>
        <text x="615" y="22" class="journey-node">예약 완료</text>
      </g>
    </g>

    <!-- Journey 4 -->
    <g transform="translate(24, 270)">
      <text x="0" y="20" class="journey-label">4. 예외 복구</text>
      <g transform="translate(200, 0)">
        <rect x="0" y="0" width="190" height="36" rx="6" fill="#FEE2E2" stroke="#EF4444" stroke-dasharray="3,3"/>
        <text x="95" y="22" class="journey-node">검색 실패/위치 권한 거부</text>
        <line x1="190" y1="18" x2="220" y2="18" stroke="#EF4444" stroke-dasharray="3,3" stroke-width="2"/>

        <rect x="220" y="0" width="150" height="36" rx="6" fill="#F1F5F9" stroke="#CBD5E1"/>
        <text x="295" y="22" class="journey-node">지역 직접 검색</text>
        <line x1="370" y1="18" x2="400" y2="18" stroke="#EF4444" stroke-dasharray="3,3" stroke-width="2"/>

        <rect x="400" y="0" width="180" height="36" rx="6" fill="#FEE2E2" stroke="#EF4444" stroke-dasharray="3,3"/>
        <text x="490" y="22" class="journey-node">세션 만료/권한 없음</text>
        <line x1="580" y1="18" x2="610" y2="18" stroke="#EF4444" stroke-dasharray="3,3" stroke-width="2"/>

        <rect x="610" y="0" width="170" height="36" rx="6" fill="#FEF3C7" stroke="#F59E0B" stroke-dasharray="3,3"/>
        <text x="695" y="22" class="journey-node">로그인 후 원위치</text>
      </g>
    </g>

    <!-- Bottom Footnote -->
    <text x="570" y="380" class="footnote">점선 테두리 = 입력 문서에 없는 최소 보완 가정 · 각 카테고리 간 단일 페이지 재사용 구조 적용</text>
  </g>
</svg>