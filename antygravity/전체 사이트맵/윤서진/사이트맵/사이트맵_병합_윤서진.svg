<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 780" width="100%" height="100%" style="background:#0F1A30; font-family:'Pretendard', 'Noto Sans KR', sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <style>
    .title { font-size: 24px; font-weight: 800; fill: #C5A059; text-anchor: middle; }
    .subtitle { font-size: 13px; fill: #CBD5E1; text-anchor: middle; }
    .main-box { fill: #1E293B; stroke: #C5A059; stroke-width: 2.5px; rx: 8px; filter: url(#shadow); }
    .main-text { font-size: 15px; font-weight: 800; fill: #FFFFFF; text-anchor: middle; }
    .gnb-box { fill: #1E293B; stroke: #475569; stroke-width: 1.5px; rx: 6px; filter: url(#shadow); }
    .gnb-text { font-size: 13px; font-weight: 700; fill: #E2E8F0; text-anchor: middle; }
    .sub-box { fill: #0F172A; stroke: #334155; stroke-width: 1px; rx: 4px; }
    .sub-text { font-size: 11px; fill: #94A3B8; text-anchor: middle; }
    .line { stroke: #C5A059; stroke-width: 2px; }
    .sub-line { stroke: #475569; stroke-width: 1.5px; }
  </style>

  <text x="550" y="45" class="title">사단(士團) 윤서진 최적 병합 사이트맵 (Merged Sitemap SVG)</text>
  <text x="550" y="70" class="subtitle">[단일 시각화 차트] 개별 시안 1~3 통합 최적 IA 구조</text>

  <rect x="380" y="95" width="340" height="48" class="main-box"/>
  <text x="550" y="125" class="main-text">사단(士團) 메인 플래그십 (P-MAIN)</text>

  <line x1="550" y1="143" x2="550" y2="170" class="line"/>
  <line x1="80" y1="170" x2="1020" y2="170" class="line"/>

  <!-- GNB Columns -->
  <line x1="80" y1="170" x2="80" y2="200" class="line"/>
  <rect x="10" y="200" width="140" height="40" class="gnb-box"/>
  <text x="80" y="225" class="gnb-text">1.0 Heritage</text>

  <line x1="214" y1="170" x2="214" y2="200" class="line"/>
  <rect x="144" y="200" width="140" height="40" class="gnb-box"/>
  <text x="214" y="225" class="gnb-text">2.0 Master Coll</text>

  <line x1="348" y1="170" x2="348" y2="200" class="line"/>
  <rect x="278" y="200" width="140" height="40" class="gnb-box"/>
  <text x="348" y="225" class="gnb-text">3.0 3D Atelier</text>

  <line x1="482" y1="170" x2="482" y2="200" class="line"/>
  <rect x="412" y="200" width="140" height="40" class="gnb-box"/>
  <text x="482" y="225" class="gnb-text">4.0 Artisan Journal</text>

  <line x1="616" y1="170" x2="616" y2="200" class="line"/>
  <rect x="546" y="200" width="140" height="40" class="gnb-box"/>
  <text x="616" y="225" class="gnb-text">5.0 Certificate</text>

  <line x1="750" y1="170" x2="750" y2="200" class="line"/>
  <rect x="680" y="200" width="140" height="40" class="gnb-box"/>
  <text x="750" y="225" class="gnb-text">6.0 Global Boutique</text>

  <line x1="884" y1="170" x2="884" y2="200" class="line"/>
  <rect x="814" y="200" width="140" height="40" class="gnb-box"/>
  <text x="884" y="225" class="gnb-text">7.0 Review</text>

  <line x1="1018" y1="170" x2="1018" y2="200" class="line"/>
  <rect x="948" y="200" width="140" height="40" class="gnb-box"/>
  <text x="1018" y="225" class="gnb-text">8.0 Concierge</text>
</svg>
