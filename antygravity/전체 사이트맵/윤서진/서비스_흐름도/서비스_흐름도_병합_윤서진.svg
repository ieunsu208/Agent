<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 680" width="100%" height="100%" style="background:#0F1A30; font-family:'Pretendard', 'Noto Sans KR', sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#C5A059"/>
    </marker>
  </defs>

  <style>
    .title { font-size: 24px; font-weight: 800; fill: #C5A059; text-anchor: middle; }
    .subtitle { font-size: 13px; fill: #CBD5E1; text-anchor: middle; }
    .node-start { fill: #C5A059; stroke: #B45309; stroke-width: 2px; rx: 20px; filter: url(#shadow); }
    .start-text { font-size: 14px; font-weight: 800; fill: #0F1A30; text-anchor: middle; }
    .node-box { fill: #1E293B; stroke: #475569; stroke-width: 1.5px; rx: 8px; filter: url(#shadow); }
    .node-text { font-size: 13px; font-weight: 700; fill: #E2E8F0; text-anchor: middle; }
    .node-accent { fill: #1E293B; stroke: #C5A059; stroke-width: 2px; rx: 8px; filter: url(#shadow); }
    .accent-text { font-size: 13px; font-weight: 800; fill: #C5A059; text-anchor: middle; }
    .arrow-line { stroke: #C5A059; stroke-width: 2px; marker-end: url(#arrow); }
  </style>

  <text x="475" y="45" class="title">사단(士團) 윤서진 최적 병합 서비스 흐름도 (Merged Flowchart SVG)</text>
  <text x="475" y="70" class="subtitle">[단일 시각화 차트] 시안 1~3 최적 병합 유저 플로우</text>

  <rect x="300" y="100" width="350" height="46" class="node-start"/>
  <text x="475" y="128" class="start-text">1. 4K 풀스크린 시네마틱 론칭 오프닝 진입</text>

  <line x1="475" y1="146" x2="475" y2="185" class="arrow-line"/>

  <rect x="320" y="185" width="310" height="44" class="node-accent"/>
  <text x="475" y="212" class="accent-text">2. 사용자 글로벌 탐색 목적 선택</text>

  <line x1="320" y1="207" x2="160" y2="265" class="arrow-line"/>
  <line x1="475" y1="229" x2="475" y2="265" class="arrow-line"/>
  <line x1="630" y1="207" x2="790" y2="265" class="arrow-line"/>

  <rect x="60" y="265" width="200" height="42" class="node-box"/>
  <text x="160" y="291" class="node-text">Heritage History (역사)</text>

  <rect x="375" y="265" width="200" height="42" class="node-box"/>
  <text x="475" y="291" class="node-text">3D Module Atelier (각인)</text>

  <rect x="690" y="265" width="200" height="42" class="node-box"/>
  <text x="790" y="291" class="node-text">Master Collection (제품)</text>

  <line x1="160" y1="307" x2="475" y2="365" class="arrow-line"/>
  <line x1="475" y1="307" x2="475" y2="365" class="arrow-line"/>
  <line x1="790" y1="307" x2="475" y2="365" class="arrow-line"/>

  <rect x="320" y="365" width="310" height="46" class="node-accent"/>
  <text x="475" y="393" class="accent-text">3. 놋쇠 마패 참(Charm) 레이저 각인 툴</text>

  <line x1="475" y1="411" x2="475" y2="450" class="arrow-line"/>

  <rect x="300" y="450" width="350" height="44" class="node-box"/>
  <text x="475" y="477" class="node-text">4. 다국어(KOR/ENG/FRA) &amp; Stripe 결제</text>

  <line x1="475" y1="494" x2="475" y2="535" class="arrow-line"/>

  <rect x="280" y="535" width="390" height="48" class="node-start"/>
  <text x="475" y="564" class="start-text">5. 주문 완료 &amp; 암행어사 첩보 디지털 보증서 발급</text>
</svg>
