<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 700" width="100%" height="100%" style="background:#0F1A30; font-family:'Pretendard', sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <style>
    .title { font-size: 22px; font-weight: 800; fill: #C5A059; text-anchor: middle; }
    .subtitle { font-size: 13px; fill: #CBD5E1; text-anchor: middle; }
    .main-box { fill: #1E293B; stroke: #C5A059; stroke-width: 2.5px; rx: 8px; filter: url(#shadow); }
    .main-text { font-size: 15px; font-weight: 800; fill: #FFFFFF; text-anchor: middle; }
    .gnb-box { fill: #1E293B; stroke: #C5A059; stroke-width: 1.5px; rx: 6px; filter: url(#shadow); }
    .gnb-text { font-size: 13px; font-weight: 800; fill: #C5A059; text-anchor: middle; }
    .sub-box { fill: #0F172A; stroke: #334155; stroke-width: 1px; rx: 5px; }
    .sub-text { font-size: 11px; font-weight: 600; fill: #E2E8F0; text-anchor: middle; }
    .line { stroke: #C5A059; stroke-width: 2px; }
    .sub-line { stroke: #475569; stroke-width: 1.5px; }
  </style>
  <text x="750" y="45" class="title">사단(士團) 한유진 글로벌 몰 최적 병합 사이트맵 (Sitemap SVG)</text>
  <text x="750" y="70" class="subtitle">[최적 병합 시각화 차트] 8대 GNB 구조 1:1 매칭</text>
  <rect x="550" y="95" width="400" height="48" class="main-box"/>
  <text x="750" y="125" class="main-text">사단(士團) 한유진 라이브 몰 (P-MAIN)</text>
  <line x1="750" y1="143" x2="750" y2="175" class="line"/>
  <line x1="120" y1="175" x2="1380" y2="175" class="line"/>
  
  <line x1="120" y1="175" x2="120" y2="205" class="line"/>
  <rect x="40" y="205" width="160" height="42" class="gnb-box"/>
  <text x="120" y="231" class="gnb-text">1.0 BRAND</text>
  
  <line x1="300" y1="175" x2="300" y2="205" class="line"/>
  <rect x="220" y="205" width="160" height="42" class="gnb-box"/>
  <text x="300" y="231" class="gnb-text">2.0 COLLECTION</text>
  
  <line x1="480" y1="175" x2="480" y2="205" class="line"/>
  <rect x="400" y="205" width="160" height="42" class="gnb-box"/>
  <text x="480" y="231" class="gnb-text">3.0 CUSTOM STUDIO</text>
  
  <line x1="660" y1="175" x2="660" y2="205" class="line"/>
  <rect x="580" y="205" width="160" height="42" class="gnb-box"/>
  <text x="660" y="231" class="gnb-text">4.0 DISCOVERY</text>
  
  <line x1="840" y1="175" x2="840" y2="205" class="line"/>
  <rect x="760" y="205" width="160" height="42" class="gnb-box"/>
  <text x="840" y="231" class="gnb-text">5.0 FLAGSHIP STORE</text>
  
  <line x1="1020" y1="175" x2="1020" y2="205" class="line"/>
  <rect x="940" y="205" width="160" height="42" class="gnb-box"/>
  <text x="1020" y="231" class="gnb-text">6.0 INGREDIENTS</text>
  
  <line x1="1200" y1="175" x2="1200" y2="205" class="line"/>
  <rect x="1120" y="205" width="160" height="42" class="gnb-box"/>
  <text x="1200" y="231" class="gnb-text">7.0 MEMBERSHIP</text>
  
  <line x1="1380" y1="175" x2="1380" y2="205" class="line"/>
  <rect x="1300" y="205" width="160" height="42" class="gnb-box"/>
  <text x="1380" y="231" class="gnb-text">8.0 REVIEWS</text>
</svg>
