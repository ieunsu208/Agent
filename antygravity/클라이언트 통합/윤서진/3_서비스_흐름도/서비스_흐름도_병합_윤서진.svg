<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 630" width="100%" height="100%" style="background:#0F1A30; font-family:'Pretendard', sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#C5A059"/>
    </marker>
  </defs>
  <style>
    .title { font-size: 22px; font-weight: 800; fill: #C5A059; text-anchor: middle; }
    .subtitle { font-size: 13px; fill: #CBD5E1; text-anchor: middle; }
    .node-start { fill: #C5A059; stroke: #B45309; stroke-width: 2px; rx: 22px; filter: url(#shadow); }
    .start-text { font-size: 14px; font-weight: 800; fill: #0F1A30; text-anchor: middle; }
    .node-choice { fill: #1E293B; stroke: #C5A059; stroke-width: 2px; rx: 10px; filter: url(#shadow); }
    .choice-text { font-size: 13px; font-weight: 800; fill: #C5A059; text-anchor: middle; }
    .node-box { fill: #1E293B; stroke: #475569; stroke-width: 1.5px; rx: 8px; filter: url(#shadow); }
    .node-text { font-size: 13px; font-weight: 700; fill: #E2E8F0; text-anchor: middle; }
    .arrow-line { stroke: #C5A059; stroke-width: 2px; marker-end: url(#arrow); }
  </style>
  <text x="475" y="45" class="title">사단(士團) 윤서진 서비스 흐름도 (Flowchart SVG)</text>
  <text x="475" y="70" class="subtitle">[최적 병합 시각화 차트] 시네마틱 오프닝 &amp; 3D 각인 결제 유저 플로우 매칭</text>
  <rect x="265" y="100" width="420" height="46" class="node-start"/>
  <text x="475" y="128" class="start-text">1. 4K 풀스크린 시네마틱 론칭 오프닝 진입</text>
  <line x1="475" y1="123" x2="475" y2="185" class="arrow-line"/>
  <rect x="265" y="185" width="420" height="46" class="node-choice"/>
  <text x="475" y="213" class="choice-text">2. 사용자 글로벌 탐색 목적 선택</text>
  <line x1="475" y1="208" x2="475" y2="270" class="arrow-line"/>
  <rect x="265" y="270" width="420" height="46" class="node-box"/>
  <text x="475" y="298" class="node-text">3. 3D Module Atelier 용기 결합 &amp; 각인</text>
  <line x1="475" y1="293" x2="475" y2="355" class="arrow-line"/>
  <rect x="265" y="355" width="420" height="46" class="node-box"/>
  <text x="475" y="383" class="node-text">4. 놋쇠 마패 참(Charm) 레이저 텍스트 각인 툴</text>
  <line x1="475" y1="378" x2="475" y2="440" class="arrow-line"/>
  <rect x="265" y="440" width="420" height="46" class="node-box"/>
  <text x="475" y="468" class="node-text">5. 글로벌 다국어(KOR/ENG/FRA) &amp; Stripe 결제</text>
  <line x1="475" y1="463" x2="475" y2="525" class="arrow-line"/>
  <rect x="265" y="525" width="420" height="46" class="node-start"/>
  <text x="475" y="553" class="start-text">6. 주문 완료 &amp; 암행어사 첩보 디지털 보증서 발급</text>
</svg>