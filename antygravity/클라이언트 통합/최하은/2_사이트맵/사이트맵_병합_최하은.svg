<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650" style="background-color: #0f172a; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="rootGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="500" y="45" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="bold">[사단(士團)] 최하은 클라이언트 최적 병합 사이트맵 (IA)</text>
  
  <!-- Root Node -->
  <rect x="350" y="70" width="300" height="55" rx="10" fill="url(#rootGrad)" filter="url(#shadow)"/>
  <text x="500" y="95" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="bold">사단(士團) AI 조향 &amp; 3D 각인 자사몰</text>
  <text x="500" y="115" text-anchor="middle" fill="#dbeafe" font-size="12">최하은 PM (5개 시안 최적 병합)</text>

  <!-- Connectors from Root to Level 1 -->
  <path d="M 500 125 L 500 160" stroke="#64748b" stroke-width="2" fill="none"/>
  <path d="M 110 160 L 890 160" stroke="#64748b" stroke-width="2" fill="none"/>
  
  <path d="M 110 160 L 110 190" stroke="#3b82f6" stroke-width="2" fill="none"/>
  <path d="M 305 160 L 305 190" stroke="#3b82f6" stroke-width="2" fill="none"/>
  <path d="M 500 160 L 500 190" stroke="#3b82f6" stroke-width="2" fill="none"/>
  <path d="M 695 160 L 695 190" stroke="#3b82f6" stroke-width="2" fill="none"/>
  <path d="M 890 160 L 890 190" stroke="#3b82f6" stroke-width="2" fill="none"/>

  <!-- GNB 1 -->
  <g transform="translate(20, 190)">
    <rect x="0" y="0" width="180" height="45" rx="6" fill="url(#nodeGrad)" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="90" y="27" text-anchor="middle" fill="#60a5fa" font-size="13" font-weight="bold">1.0 AI Scent Finder</text>

    <path d="M 90 45 L 90 70" stroke="#475569" stroke-width="1.5" fill="none"/>
    <rect x="10" y="70" width="160" height="32" rx="4" fill="#0f172a" stroke="#334155"/>
    <text x="90" y="91" text-anchor="middle" fill="#94a3b8" font-size="11">1.1 5문항 취향 퀴즈</text>

    <path d="M 90 102 L 90 115" stroke="#475569" stroke-width="1.5" fill="none"/>
    <rect x="10" y="115" width="160" height="32" rx="4" fill="#0f172a" stroke="#334155"/>
    <text x="90" y="136" text-anchor="middle" fill="#94a3b8" font-size="11">1.2 맞춤 향 매칭 결과</text>

    <path d="M 90 147 L 90 160" stroke="#475569" stroke-width="1.5" fill="none"/>
    <rect x="10" y="160" width="160" height="32" rx="4" fill="#0f172a" stroke="#334155"/>
    <text x="90" y="181" text-anchor="middle" fill="#94a3b8" font-size="11">1.3 어사 레시피 갤러리</text>
  </g>

  <!-- GNB 2 -->
  <g transform="translate(215, 190)">
    <rect x="0" y="0" width="180" height="45" rx="6" fill="url(#nodeGrad)" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="90" y="27" text-anchor="middle" fill="#60a5fa" font-size="13" font-weight="bold">2.0 3D Engraving Studio</text>

    <path d="M 90 45 L 90 70" stroke="#475569" stroke-width="1.5" fill="none"/>
    <rect x="10" y="70" width="160" height="32" rx="4" fill="#0f172a" stroke="#334155"/>
    <text x="90" y="91" text-anchor="middle" fill="#94a3b8" font-size="11">2.1 3D 용기 렌더링 캔버스</text>

    <path d="M 90 102 L 90 115" stroke="#475569" stroke-width="1.5" fill="none"/>
    <rect x="10" y="115" width="160" height="32" rx="4" fill="#0f172a" stroke="#334155"/>
    <text x="90" y="136" text-anchor="middle" fill="#94a3b8" font-size="11">2.2 서체 선택 (한자/한글)</text>

    <path d="M 90 147 L 90 160" stroke="#475569" stroke-width="1.5" fill="none"/>
    <rect x="10" y="160" width="160" height="32" rx="4" fill="#0f172a" stroke="#334155"/>
    <text x="90" y="181" text-anchor="middle" fill="#94a3b8" font-size="11">2.3 각인 선물 패키징</text>
  </g>

  <!-- GNB 3 -->
  <g transform="translate(410, 190)">
    <rect x="0" y="0" width="180" height="45" rx="6" fill="url(#nodeGrad)" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="90" y="27" text-anchor="middle" fill="#60a5fa" font-size="13" font-weight="bold">3.0 Custom Note Mixer</text>

    <path d="M 90 45 L 90 70" stroke="#475569" stroke-width="1.5" fill="none"/>
    <rect x="10" y="70" width="160" height="32" rx="4" fill="#0f172a" stroke="#334155"/>
    <text x="90" y="91" text-anchor="middle" fill="#94a3b8" font-size="11">3.1 T/M/B 비율 믹서</text>

    <path d="M 90 102 L 90 115" stroke="#475569" stroke-width="1.5" fill="none"/>
    <rect x="10" y="115" width="160" height="32" rx="4" fill="#0f172a" stroke="#334155"/>
    <text x="90" y="136" text-anchor="middle" fill="#94a3b8" font-size="11">3.2 향 피라미드 시각화</text>
  </g>

  <!-- GNB 4 -->
  <g transform="translate(605, 190)">
    <rect x="0" y="0" width="180" height="45" rx="6" fill="url(#nodeGrad)" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="90" y="27" text-anchor="middle" fill="#60a5fa" font-size="13" font-weight="bold">4.0 Eco Refill Sub</text>

    <path d="M 90 45 L 90 70" stroke="#475569" stroke-width="1.5" fill="none"/>
    <rect x="10" y="70" width="160" height="32" rx="4" fill="#0f172a" stroke="#334155"/>
    <text x="90" y="91" text-anchor="middle" fill="#94a3b8" font-size="11">4.1 카트리지 정기 구독</text>

    <path d="M 90 102 L 90 115" stroke="#475569" stroke-width="1.5" fill="none"/>
    <rect x="10" y="115" width="160" height="32" rx="4" fill="#0f172a" stroke="#334155"/>
    <text x="90" y="136" text-anchor="middle" fill="#94a3b8" font-size="11">4.2 공병 반납 리워드</text>
  </g>

  <!-- GNB 5 -->
  <g transform="translate(800, 190)">
    <rect x="0" y="0" width="180" height="45" rx="6" fill="url(#nodeGrad)" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="90" y="27" text-anchor="middle" fill="#60a5fa" font-size="13" font-weight="bold">5.0 Safety &amp; Heritage</text>

    <path d="M 90 45 L 90 70" stroke="#475569" stroke-width="1.5" fill="none"/>
    <rect x="10" y="70" width="160" height="32" rx="4" fill="#0f172a" stroke="#334155"/>
    <text x="90" y="91" text-anchor="middle" fill="#94a3b8" font-size="11">5.1 화해 비건 성분표</text>

    <path d="M 90 102 L 90 115" stroke="#475569" stroke-width="1.5" fill="none"/>
    <rect x="10" y="115" width="160" height="32" rx="4" fill="#0f172a" stroke="#334155"/>
    <text x="90" y="136" text-anchor="middle" fill="#94a3b8" font-size="11">5.2 알레르기 필터</text>
  </g>
</svg>
