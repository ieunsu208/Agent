<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="100%">
  <rect width="1000" height="480" fill="#090a0f" rx="12"/>
  <rect x="330" y="20" width="340" height="45" rx="8" fill="#1e1b18" stroke="#d97706" stroke-width="1.5"/>
  <text x="500" y="48" fill="#fef3c7" font-family="'Pretendard', sans-serif" font-size="15" font-weight="900" text-anchor="middle">사단(士團) 조민재 최적 병합 서비스 흐름도</text>

  <!-- 4 Tracks -->
  <g font-family="'Pretendard', sans-serif" font-size="12" font-weight="800" text-anchor="middle">
    <!-- Start -->
    <circle cx="500" cy="95" r="16" fill="#78350f"/>
    <text x="500" y="99" fill="#fef3c7" font-size="10">진입</text>

    <!-- Lines to Tracks -->
    <line x1="500" y1="111" x2="140" y2="140" stroke="#78350f" stroke-width="1.5"/>
    <line x1="500" y1="111" x2="380" y2="140" stroke="#78350f" stroke-width="1.5"/>
    <line x1="500" y1="111" x2="620" y2="140" stroke="#78350f" stroke-width="1.5"/>
    <line x1="500" y1="111" x2="860" y2="140" stroke="#78350f" stroke-width="1.5"/>

    <!-- Track 1 -->
    <rect x="50" y="140" width="180" height="40" rx="6" fill="#27272a" stroke="#d97706" stroke-width="1"/>
    <text x="140" y="165" fill="#fef3c7">트랙 A: 칵테일 페어링</text>

    <!-- Track 2 -->
    <rect x="290" y="140" width="180" height="40" rx="6" fill="#27272a" stroke="#d97706" stroke-width="1"/>
    <text x="380" y="165" fill="#fef3c7">트랙 B: 놋쇠 홀더 3D</text>

    <!-- Track 3 -->
    <rect x="530" y="140" width="180" height="40" rx="6" fill="#27272a" stroke="#d97706" stroke-width="1"/>
    <text x="620" y="165" fill="#fef3c7">트랙 C: 미드나잇 기프트</text>

    <!-- Track 4 -->
    <rect x="770" y="140" width="180" height="40" rx="6" fill="#27272a" stroke="#d97706" stroke-width="1"/>
    <text x="860" y="165" fill="#fef3c7">트랙 D: 비밀 심야 바</text>
  </g>

  <!-- Decision Nodes & Actions -->
  <g font-family="'Pretendard', sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#d4d4d8">
    <line x1="140" y1="180" x2="500" y2="230" stroke="#3f3f46" stroke-width="1.5"/>
    <line x1="380" y1="180" x2="500" y2="230" stroke="#3f3f46" stroke-width="1.5"/>
    <line x1="620" y1="180" x2="500" y2="230" stroke="#3f3f46" stroke-width="1.5"/>
    <line x1="860" y1="180" x2="500" y2="230" stroke="#3f3f46" stroke-width="1.5"/>

    <rect x="340" y="230" width="320" height="45" rx="8" fill="#18181b" stroke="#d97706" stroke-width="1.5"/>
    <text x="500" y="258" fill="#fef3c7" font-weight="900">3대 딥 스모키 노트 &amp; 죽탄 인센스 스틱 선택</text>

    <line x1="500" y1="275" x2="320" y2="320" stroke="#3f3f46" stroke-width="1.5"/>
    <line x1="500" y1="275" x2="680" y2="320" stroke="#3f3f46" stroke-width="1.5"/>

    <rect x="200" y="320" width="240" height="40" rx="6" fill="#27272a" stroke="#3f3f46" stroke-width="1"/>
    <text x="320" y="345" fill="#ffffff">매트 블랙 옻칠 기프트 세트</text>

    <rect x="560" y="320" width="240" height="40" rx="6" fill="#27272a" stroke="#3f3f46" stroke-width="1"/>
    <text x="680" y="345" fill="#ffffff">단품 보틀 / 놋쇠 홀더 단품</text>

    <line x1="320" y1="360" x2="500" y2="400" stroke="#3f3f46" stroke-width="1.5"/>
    <line x1="680" y1="360" x2="500" y2="400" stroke="#3f3f46" stroke-width="1.5"/>

    <rect x="340" y="400" width="320" height="50" rx="8" fill="#1e1b18" stroke="#d97706" stroke-width="1.5"/>
    <text x="500" y="430" fill="#fef3c7" font-weight="900">주문 결제 &amp; 비밀 심야 바 암호 코드 발급 완료</text>
  </g>
</svg>
