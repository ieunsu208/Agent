                          - gridcell [aria-hidden] [ref=e5788]
                          - 'gridcell "[3섹션: 3단계 마패 체계] - 마음에 안 들었던 부분: * 1, 2, 3마패가 세로형 리스트로 단순 나열되어 있어 스크롤이 길어지고, 3개 마패의 구조적 차이 비교가 어려움. * 텍스트 밀도가 너무 높아 한눈에 들어오지 않음. - 수정한 부분: * 가로 확장 인터랙티브 아코디언 카드 구조로 전면 수정 * 접힘 상태는 넘버링, 등급, 가격만 미니멀하게 노출하고, 클릭 시 가로로 펼쳐지는 모노크롬 분할 뷰 적용." [ref=e5796]'
                      - row [ref=e6866]:
                        - generic [ref=e5801]:
                          - gridcell [aria-hidden] [ref=e5804]
                          - 'gridcell "[5섹션: 2마패 시그니처 스토리 (적송 홍화)] - 마음에 안 들었던 부분: * 스펙과 원료 정보가 산만하게 흩어져 있음. - 수정한 부분: * 3마패와 통일된 2열 클린 라인 미니 스펙 정보(향의 성격, 추천 순간, 가격, 부향률) 정돈. * 우측 화보 아래 레이어링 카드 및 슬림한 가로형 시그니처 페어링 바 배치." [ref=e5812]'
                        - generic [ref=e6867]:
